upstream php_fpm {
    server php:9000;
}

server {
    listen 80;
    server_name _;
    client_max_body_size 32M;
    gzip on;
    server_tokens off;

    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # Header di sicurezza. Una location con un proprio add_header non eredita questi (vedi /assets/).
    # HSTS sta sul reverse proxy che termina il TLS (vhost Apache, AGENTS.md §12).
    # style-src con 'unsafe-inline': Vue scrive i nodi statici via innerHTML, attributi style compresi.
    # img data: per il QR della 2FA.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Laravel API, Sanctum e health check /up: sempre inoltrati a PHP-FPM, che serve
    # index.php dalla propria immagine (nessun filesystem Laravel condiviso con nginx).
    location ~ ^/(api|sanctum|up)(/.*)?$ {
        fastcgi_pass php_fpm;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_param PATH_INFO $uri;
        fastcgi_read_timeout 120;
    }

    # nginx non conosce l'estensione .webmanifest: senza questo il file arriva
    # come application/octet-stream e Chrome ignora il manifest (niente
    # installazione). Un `types { }` qui sostituirebbe l'intera mappa MIME del
    # server, quindi si corregge solo questa location.
    location = /manifest.webmanifest {
        root /var/www/spa;
        default_type application/manifest+json;
    }

    # SPA fallback
    location / {
        root /var/www/spa;
        try_files $uri $uri/ /index.html;
        expires 1h;
    }

    # Asset Vite con hash → cache lunga
    location /assets/ {
        root /var/www/spa;
        expires 30d;
        access_log off;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
    }
}
