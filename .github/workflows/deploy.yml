name: Deploy

# Solo su tag v*: una release pubblicata da GitHub crea il suo tag e passa di qui.
on:
  push:
    tags: ['v*']

concurrency: deploy

# Il token serve solo al checkout della CI chiamata: il deploy passa da SSH.
permissions:
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  deploy:
    name: Deploy su VPS
    needs: ci
    runs-on: ubuntu-latest
    steps:
      - name: SSH deploy
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1
        env:
          TAG: ${{ github.ref_name }}
        with:
          envs: TAG
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          passphrase: ${{ secrets.SSH_PASSPHRASE }}
          port: ${{ secrets.SSH_PORT }}
          script: |
            set -e
            cd "${{ vars.DEPLOY_PATH }}"
            pwd

            # .env.production appartiene all'host (dominio, segreti, chiavi VAPID): il checkout non
            # deve mai toccarlo. Fino al 2026-10-02 era tracciato con modifiche locali: le si scarta
            # per far passare il checkout (il commit che lo de-traccia lo rimuoverebbe) e la copia
            # torna al suo posto in ogni caso, anche se il deploy fallisce.
            ENV_BACKUP="$(mktemp)"
            cp .env.production "$ENV_BACKUP"
            trap 'cp "$ENV_BACKUP" .env.production; rm -f "$ENV_BACKUP"' EXIT
            git checkout -- .env.production 2>/dev/null || true
            git fetch --tags --force origin
            git checkout --detach "refs/tags/$TAG"
            cp "$ENV_BACKUP" .env.production

            COMPOSE="docker compose --env-file .env.production -f docker-compose.vps.yml"
            # Immagini base aggiornate a ogni deploy: senza pull restano quelle in cache,
            # senza le patch di sicurezza uscite sullo stesso tag (php, nginx, node).
            # mysql e redis per nome: php, scheduler e queue usano un'immagine locale.
            $COMPOSE pull mysql redis
            APP_VERSION="$TAG" $COMPOSE build --pull
            $COMPOSE up -d

            # Backup prima di toccare lo schema: il codice si torna indietro con git,
            # una migration no. Lo stack è già su, quindi il dump non può fallire
            # per database spento.
            COMPOSE_FILE=docker-compose.vps.yml COMPOSE_ENV_FILES=.env.production ./scripts/backup.sh

            # Senza questo le migration non venivano mai eseguite in produzione: le
            # colonne nuove restavano assenti e le scritture andavano in errore 500.
            $COMPOSE exec -T php php artisan migrate --force

            # Health check attraverso nginx → PHP-FPM → Laravel: un deploy con l'app
            # giù deve fallire, non chiudersi verde. Attesa massima ~60s per il boot.
            for i in $(seq 1 20); do
              $COMPOSE exec -T nginx wget -q -O /dev/null http://127.0.0.1/up && exit 0
              sleep 3
            done
            echo "Health check /up fallito" >&2
            $COMPOSE ps
            exit 1
